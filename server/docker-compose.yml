services:
  retixhub:
    build: .
    container_name: retixhub
    restart: unless-stopped
    network_mode: host            # wg0 и правила iptables создаются на хосте
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun
    env_file: .env
    volumes:
      - ./data:/data              # vpn.db, server.key, secret.key
      - /lib/modules:/lib/modules:ro
