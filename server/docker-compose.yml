services:
  retixhub:
    build: .
    container_name: retixhub
    restart: unless-stopped
    network_mode: host            # wg0 и правила iptables создаются на хосте
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun
    env_file: .env
    volumes:
      # данные на хосте: /root/hub (vpn.db, server.key, secret.key, downloads/)
      - ${HUB_DATA:-/root/hub}:/data
      - /lib/modules:/lib/modules:ro
