# /etc/nginx/conf.d/hub.retix.uz.conf
# Только HTTP: SSL и редирект на https добавляет сам certbot:
#   certbot --nginx -d hub.retix.uz --redirect
# (он правит только этот блок server, другие сайты не трогает)
server {
    listen 80;
    listen [::]:80;
    server_name hub.retix.uz;

    # загрузка установщика клиента в суперадмине (Обновления): до 300 МБ, только этот адрес
    location = /admin/updates {
        client_max_body_size 300m;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
