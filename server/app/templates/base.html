<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} — Retix Hub</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --text:#1d2430; --muted:#6b7685; --line:#e3e7ee;
          --accent:#2563eb; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:12px 24px; background:#111827; color:#fff; }
  header .sub { color:#9ca3af; } header form { margin-left:auto; }
  header a { color:#fff; text-decoration:none; }
  .adminnav { display:flex; gap:14px; margin-left:18px; } .adminnav a { color:#9ca3af; } .adminnav a.on { color:#fff; font-weight:600; }
  .small { font-size:12px; } .nowrap { white-space:nowrap; } textarea { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:7px; width:100%; }
  .inline { display:inline; margin:0; } .opt { display:flex; gap:8px; align-items:flex-start; margin:4px 0; } .opt input { margin-top:3px; }
  .scope-box { max-height:150px; overflow:auto; border:1px solid var(--line); border-radius:7px; padding:6px 10px; margin-top:4px; }
  .tbl-wrap { overflow-x:auto; } input[type=file], input[type=datetime-local] { font:inherit; }
  .key { word-break:break-all; user-select:all; }
  main { max-width:1150px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:18px; }
  h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:16px; margin:0 0 12px; }
  .muted { color:var(--muted); }
  .stats { display:flex; gap:28px; flex-wrap:wrap; margin-top:10px; }
  .stats b { display:block; font-size:18px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; background:#cbd5e1; }
  .dot.on { background:var(--ok); }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:12px; background:#eef2ff; color:#3730a3; }
  .tag.warn { background:#fef3c7; color:#92400e; } .tag.bad { background:#fee2e2; color:#991b1b; }
  .tag.share { background:#dcfce7; color:#166534; }
  .actions { display:flex; gap:4px; flex-wrap:wrap; } .actions form { margin:0; }
  button, .btn { font:inherit; padding:6px 12px; border-radius:7px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--text); text-decoration:none; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--bad); } button.small { padding:3px 8px; font-size:12px; }
  button.link { background:none; border:none; color:#fff; padding:0; }
  input[type=text], input[type=password], input[type=number] { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:7px; width:100%; }
  label { display:block; margin-bottom:10px; } label span { display:block; color:var(--muted); font-size:12px; margin-bottom:3px; }
  label.check { display:flex; gap:8px; align-items:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; }
  .msg { padding:10px 14px; border-radius:8px; margin-bottom:16px; background:#dcfce7; color:#166534; }
  .msg.err { background:#fee2e2; color:#991b1b; }
  .login { max-width:360px; margin:80px auto; }
  code { background:#f1f5f9; padding:1px 5px; border-radius:4px; }
  .rename { display:flex; gap:4px; } .rename input { width:130px; padding:3px 6px; font-size:12px; }
</style>
</head>
<body>
<header>
  <a href="/"><b>Retix Hub</b></a><span class="sub">{{ title }}</span>
  {% if admin_nav %}<nav class="adminnav"><a href="/admin" class="{{ 'on' if admin_nav == 'companies' }}">Компании</a><a href="/admin/updates" class="{{ 'on' if admin_nav == 'updates' }}">Обновления</a></nav>{% endif %}
  {% if logout_url %}<form method="post" action="{{ logout_url }}"><button class="link">Выйти</button></form>{% endif %}
</header>
<main>
  {% if msg %}<div class="msg {{ 'err' if err else '' }}">{{ msg }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<script>
  // подтверждение для форм с data-confirm. Текст берётся из атрибута, а не вставляется в JS:
  // имя ПК задаёт клиент: вставленное в обработчик формы, оно исполнялось бы как код (XSS)
  document.addEventListener('submit', function (e) {
    var text = e.target.getAttribute('data-confirm');
    if (text && !window.confirm(text)) e.preventDefault();
  });
</script>
</body>
</html>
