name: Клиент Windows

# Сборка RetixHub.exe и установщика RetixHub_Setup_<версия>.exe (client/build.bat) — ТОЛЬКО для выпуска:
#  - push в main с новой VERSION (релиза v<версия> ещё нет) -> сборка и GitHub Release v<версия>:
#    поднять VERSION в client/retixhub_client.py, дописать client/CHANGELOG.md, влить в main;
#    та же версия уже выпущена -> ничего не собирается (без повторных сборок);
#  - тег v<версия> (например v1.0.0) -> сборка и Release (тег = VERSION);
#  - Release, созданный вручную на GitHub (тег v<версия>) -> установщик прикрепляется к нему;
#  - Actions -> «Клиент Windows» -> Run workflow -> сборка в Artifacts (проверить без выпуска).
# Ветки (кроме main) установщик не собирают.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # быстро и на Linux: нужна ли сборка вообще
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      release: ${{ steps.v.outputs.release }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        env:
          REL_TAG: ${{ github.event.release.tag_name }}
        run: |
          v=$(sed -n 's/^VERSION = "\([0-9.]*\)"$/\1/p' client/retixhub_client.py | head -n 1)
          [ -n "$v" ] || { echo "Не найден VERSION в client/retixhub_client.py"; exit 1; }
          echo "VERSION = $v"
          build=false; release=false; tag="v$v"
          case "$GITHUB_EVENT_NAME" in
            push)
              if [ "$GITHUB_REF_TYPE" = tag ]; then
                [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "Тег $GITHUB_REF_NAME не совпадает с VERSION = $v"; exit 1; }
                build=true; release=true
              elif git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
                echo "Релиз v$v уже есть — сборка не нужна. Для выпуска поднимите VERSION."
              else
                build=true; release=true
              fi ;;
            release)
              tag="$REL_TAG"
              [ "$tag" = "v$v" ] || { echo "Тег Release $tag не совпадает с VERSION = $v"; exit 1; }
              build=true; release=true ;;
            workflow_dispatch)
              build=true ;;          # только Artifacts, без выпуска
          esac
          { echo "version=$v"; echo "build=$build"; echo "release=$release"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-2022
    permissions:
      contents: write          # только здесь: создать Release и приложить установщик
    concurrency:
      group: client-release-${{ needs.check.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /? | Select-Object -First 1

      - name: Описание релиза
        shell: pwsh
        env:
          VER: ${{ needs.check.outputs.version }}
        run: |
          $v = $env:VER
          # раздел этой версии из client/CHANGELOG.md
          $text = Get-Content client/CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($v))\s*\r?\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "" }
          $body = "## Что нового`n`n$notes`n`n---`n`nУстановщик клиента Retix Hub для Windows 10/11 (x64). WireGuard внутри — ставится сам, если его нет.`n`n" +
                  "Выпуск на ПК: суперадмин → **Обновления** → загрузить ``RetixHub_Setup_$v.exe`` → опубликовать. ПК обновятся сами.`n`n" +
                  "Тихая установка вручную: ``RetixHub_Setup_$v.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART``"
          Set-Content -Path release_notes.md -Value $body -Encoding UTF8

      - name: Сборка (build.bat)
        shell: cmd
        run: client\build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: RetixHub_Setup_${{ needs.check.outputs.version }}
          path: client/dist/RetixHub_Setup_*.exe
          if-no-files-found: error

      - name: Release
        if: needs.check.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Retix Hub ${{ needs.check.outputs.version }}
          files: client/dist/RetixHub_Setup_*.exe
          body_path: release_notes.md
