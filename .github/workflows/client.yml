name: Клиент Windows

# Сборка RetixHub.exe и установщика RetixHub_Setup_<версия>.exe (client/build.bat).
#  - push в любую ветку с изменениями в client/ -> установщик в Artifacts запуска;
#  - push в main с новой VERSION (релиза v<версия> ещё нет) -> GitHub Release v<версия> создаётся сам:
#    поднять VERSION в client/retixhub_client.py, дописать client/CHANGELOG.md, влить в main;
#  - тег v<версия> (например v1.0.0) -> ещё и GitHub Release с установщиком;
#  - Release, созданный вручную на GitHub (Releases -> Draft a new release, тег v<версия>)
#    -> установщик прикрепляется к нему.
#    Тег должен совпадать с VERSION в client/retixhub_client.py.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /? | Select-Object -First 1

      - name: Версия
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path client/retixhub_client.py -Pattern '^VERSION = "([0-9.]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "VERSION = $v"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Тег $env:GITHUB_REF_NAME не совпадает с VERSION = $v в client/retixhub_client.py"
          }
          # релиз: тег v*, опубликованный вручную Release, или новая версия в main
          $release = 'false'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $release = 'true' }
          elseif ($env:GITHUB_REF -eq 'refs/heads/main' -and $env:GITHUB_EVENT_NAME -eq 'push') {
            $exists = git ls-remote --tags origin "refs/tags/v$v"
            if (-not $exists) { $release = 'true' } else { Write-Host "Релиз v$v уже есть — только сборка" }
          }
          "release=$release" >> $env:GITHUB_OUTPUT
          # описание релиза: раздел этой версии из client/CHANGELOG.md
          $text = Get-Content client/CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($v))\s*\r?\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "" }
          $body = "## Что нового`n`n$notes`n`n---`n`nУстановщик клиента Retix Hub для Windows 10/11 (x64). WireGuard внутри — ставится сам, если его нет.`n`n" +
                  "На сервер: положите ``RetixHub_Setup_$v.exe`` в ``/root/hub/data/downloads/`` — сайт отдаст его по кнопке «Скачать».`n`n" +
                  "Тихая установка: ``RetixHub_Setup_$v.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART``"
          Set-Content -Path release_notes.md -Value $body -Encoding UTF8

      - name: Сборка (build.bat)
        shell: cmd
        run: client\build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: RetixHub_Setup_${{ steps.ver.outputs.version }}
          path: client/dist/RetixHub_Setup_*.exe
          if-no-files-found: error

      - name: Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Retix Hub ${{ steps.ver.outputs.version }}
          files: client/dist/RetixHub_Setup_*.exe
          body_path: release_notes.md
